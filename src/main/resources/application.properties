spring.application.name=mass-backend

server.port=${PORT:5000}

spring.datasource.url=${BD_URL}
spring.datasource.username=${BD_USER:root}
spring.datasource.password=${BD_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

brevo.api-key=${BREVO_API_KEY}
stripe.secret-key=${STRIPE_API_KEY}

ia.modelo.url=${IA_URL}

app.cors.allowed-origins=${FRONT_URL}